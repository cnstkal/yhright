<!DOCTYPE html>
<html lang="ko" data-sysbar="overlay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><script>try{if(top!==self)document.documentElement.classList.add('emb')}catch(e){document.documentElement.classList.add('emb')}</script>
<meta name="apple-mobile-web-app-capable" content="yes"><title>카카오톡</title>
<link rel="stylesheet" href="kakaotalk.css?v=ios14-2"></head>
<body data-hb="1"><main id="app">

  <section class="view" id="vList">
    <header class="hdr" id="hdr"></header>
    <div class="pages">
      <div class="pg" id="pgFriends"></div>
      <div class="pg" id="pgChats" hidden></div>
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="friends" class="on"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.6"/><path d="M2.5 20c.5-3.6 3.2-5.6 6.5-5.6s6 2 6.5 5.6"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.5c2.4 0 4.2 1.6 4.6 4.3"/></svg><span>친구</span></button>
      <button type="button" data-tab="chats"><svg viewBox="0 0 24 24"><path d="M12 3.5c-5 0-9 3.2-9 7.2 0 2.5 1.6 4.7 4 6l-1 3.8 4.4-2.5c.5.1 1.1.1 1.6.1 5 0 9-3.2 9-7.4S17 3.5 12 3.5z"/></svg><span>채팅</span><em class="bdg" id="bdg" hidden></em></button>
      <button type="button" data-tab="hash" class="dis" aria-disabled="true"><svg viewBox="0 0 24 24"><path d="M9 4 7.5 20M16.5 4 15 20M4 9h16M3.5 15h16"/></svg><span>#</span></button>
      <button type="button" data-tab="shop" class="dis" aria-disabled="true"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span>쇼핑</span></button>
      <button type="button" data-tab="more" class="dis" aria-disabled="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg><span>더보기</span></button>
    </nav>
    <div class="ind"></div>
  </section>

  <section class="view" id="vRoom" hidden>
    <header class="rbar">
      <button type="button" class="back" id="back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
      <h1 id="rName"></h1>
      <div class="ico">
        <button type="button" class="dis" aria-label="검색" aria-disabled="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
        <button type="button" class="dis" aria-label="메뉴" aria-disabled="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
    </header>
    <div class="msgs" id="msgs"></div>
    <form class="comp" id="form" autocomplete="off">
      <button type="button" class="plus dis" aria-label="첨부" aria-disabled="true"><svg viewBox="0 0 28 28"><rect x="2.5" y="2.5" width="23" height="23" rx="6"/><path d="M14 8v12M8 14h12"/></svg></button>
      <div class="field"><textarea id="inp" rows="1" enterkeyhint="send"></textarea></div>
      <button type="button" class="emo dis" aria-label="이모티콘" aria-disabled="true"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11"/><path d="M9.5 16.5c1 2.2 2.7 3.2 4.5 3.2s3.5-1 4.5-3.2M10 11.5v1.5M18 11.5v1.5"/></svg></button>
      <button type="submit" class="send" id="send">전송</button>
    </form>
    <div class="ind"></div>
  </section>

</main><script src="kakaotalk.js?v=ios14-1"></script><script src="../system-bar.js"></script></body>
</html>
