<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tinder</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="tinder.css">
</head>
<body>
<div class="phone" id="phone">
  <div id="sb"><span id="clock">1:15</span><div class="isl"></div>
    <div class="r"><svg width="20" height="14" viewBox="0 0 20 14" fill="currentColor"><path d="M10 2.5c2.6 0 5 1 6.800 2.700l1.300-1.400A12.600 12.600 0 0 0 10 .6C6.800.6 3.800 1.800 1.600 3.800l1.300 1.400A10.500 10.500 0 0 1 10 2.500zm0 4.200c1.500 0 2.800.6 3.900 1.500l1.300-1.400A8.400 8.400 0 0 0 10 4.800c-2.100 0-4 .8-5.200 2l1.300 1.400a6 6 0 0 1 3.900-1.500zM10 11l2.200-2.200a3.200 3.200 0 0 0-4.400 0z"/></svg><div class="bat">73</div></div>
  </div>

  <!-- swipe -->
  <section class="screen on" id="s-swipe">
    <div id="area">
      <div id="stack"></div>
      <div id="empty"><div style="opacity:.8">__FLAME__</div><b style="font-size:22px">근처에 더 이상 프로필이 없어요</b><span style="opacity:.7;font-size:15px">되돌리기로 이전 카드를 다시 볼 수 있어요</span></div>
      <div id="acts">
        <button class="ab sm" data-act="undo" aria-label="되돌리기">__UNDO__</button>
        <button class="ab lg" data-act="pass" aria-label="PASS">__X__</button>
        <button class="ab sm" data-act="super" aria-label="SUPER LIKE">__STAR__</button>
        <button class="ab lg" data-act="like" aria-label="LIKE">__HEART__</button>
        <button class="ab sm" data-act="share" aria-label="공유">__SEND__</button>
      </div>
    </div>
    <div id="menu">
      <button data-act="soon" style="margin-right:4px" aria-label="필터">__SLIDERS__</button>
      <button class="pill on">FOR YOU</button>
      <button class="pill" data-act="soon">더블 데이트</button>
      <button class="pill" data-act="soon">별자리</button>
      <button class="zap" data-act="soon" aria-label="부스트">__ZAP__</button>
    </div>
  </section>

  <!-- explore -->
  <section class="screen" id="s-explore">
    <div class="h1">둘러보기</div>
    <div class="guide"><div class="big">__COMPASS__</div><b style="color:#171717;font-size:20px">시뮬레이션에서는 제공하지 않아요</b><span>스와이프, LIKE, 채팅 탭에서<br>앱 기능을 체험해 보세요.</span></div>
  </section>

  <!-- like -->
  <section class="screen" id="s-like">
    <div class="h1" style="padding-bottom:0">LIKE</div>
    <div class="cats" id="cats"></div>
    <div class="chips" id="chips"></div>
    <div class="panes" id="panes"><div class="pane" id="p0"></div><div class="pane" id="p1"></div><div class="pane" id="p2"></div></div>
  </section>

  <!-- chat -->
  <section class="screen" id="s-chat">
    <div class="chead"><h1>채팅</h1><div class="caps"><button data-act="safe" aria-label="안전">__SHIELD__</button><button data-act="safe" aria-label="커뮤니티">__SMILE__</button></div></div>
    <div class="cscroll" id="cscroll"></div>
  </section>

  <!-- profile -->
  <section class="screen" id="s-profile">
    <div class="h1">프로필</div>
    <div class="guide" id="pf"></div>
  </section>

  <div id="tabbar" class="dark"></div>
  <div id="ov"></div>
  <div class="hi light" id="hi"></div>
  <div id="toast"></div>
</div>


<script src="tinder.js"></script></body>
</html>
