<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>집 · 홈 화면</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:white}body{background:radial-gradient(ellipse at 15% 10%,#52617c 0,#262c3a 42%,#12151c 100%)}main{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom)}header{height:44px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:650}.date{padding:24px 4px 28px}.date small{opacity:.72;font-size:13px}.date h1{font-size:32px;line-height:1.1;margin:7px 0 0;font-weight:650}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 8px}.app{color:#fff;text-decoration:none;text-align:center;font-size:11px}.ico{width:min(17vw,68px);height:min(17vw,68px);margin:0 auto 7px;border-radius:19px;display:grid;place-items:center;font-size:29px;background:linear-gradient(145deg,#ffffff35,#ffffff12);border:1px solid #ffffff25;box-shadow:0 8px 20px #0003}.blind{background:linear-gradient(145deg,#e64b46,#a61f2b)}.kakao{background:linear-gradient(145deg,#ffe66d,#f5c928);color:#352c10}.spacer{flex:1}.widget{border:1px solid #ffffff20;background:#ffffff12;border-radius:20px;padding:15px 17px;margin:22px 0 18px;font-size:12px;color:#ffffffb8}.widget b{display:block;color:white;font-size:14px;margin-bottom:5px}.dock{height:82px;border-radius:25px;background:#ffffff20;border:1px solid #ffffff24;backdrop-filter:blur(22px);display:flex;align-items:center;justify-content:space-evenly;margin-bottom:12px}.dock .ico{width:54px;height:54px;margin:0;border-radius:15px}.indicator{height:5px;width:108px;background:#fff;border-radius:9px;margin:0 auto 4px}
</style><style>/* Hide scrollbar UI globally while preserving scroll gestures and wheel scrolling. */*{scrollbar-width:none!important;-ms-overflow-style:none!important}*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}</style></head><body><main><header><span id="clock">9:41</span><span>▮▮▮ ◉ ▰</span></header><section class="date"><small id="day">오늘</small><h1 id="date">홈 화면</h1></section><section class="apps"><a class="app" href="apps/Blind.html"><div class="ico blind">B</div>블라인드</a><a class="app" href="apps/Kakaotalk.html"><div class="ico kakao">●</div>카카오톡</a></section><div class="spacer"></div><div class="widget"><b>오늘의 기록</b>윤호의 하루를 확인해 보세요.</div><nav class="dock"><a class="app" href="apps/Kakaotalk.html"><div class="ico kakao">●</div></a><a class="app" href="apps/Blind.html"><div class="ico blind">B</div></a></nav><div class="indicator"></div></main><script>const c=document.getElementById('clock'),dt=document.getElementById('date'),dy=document.getElementById('day');function tick(){const d=new Date();c.textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0');dt.textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일';dy.textContent=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][d.getDay()]}tick();setInterval(tick,10000)</script>
