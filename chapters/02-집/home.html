<script>
(function(){const dv=document.getElementById('device'),dp=document.getElementById('disp');
function fit(){dv.style.setProperty('--k',Math.min(innerWidth/384,innerHeight/835,1.7).toFixed(3))}addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id);
function tick(){const d=new Date(),h=d.getHours(),t=(h%12||12)+':'+String(d.getMinutes()).padStart(2,'0'),a=h<12?'오전':'오후';
$('tm').textContent=t;$('ap').textContent=a;$('sbt').textContent=a+' '+t;$('dt').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+'일월화수목금토'[d.getDay()]+'요일';if($('cw'))$('cw').textContent='일월화수목금토'[d.getDay()];if($('cd'))$('cd').textContent=d.getDate()}
tick();setInterval(tick,10000);
/* S8 시스템 UI: 내비게이션 바 색, 알림창/빠른 설정 */
if(!document.documentElement.classList.contains('emb')){
 const scr=document.querySelector('.screen'),sh=$('shade');
 const isHome=()=>{try{return /home\.html$/.test(dp.contentWindow.location.pathname)}catch(_){return true}};
 dp.addEventListener('load',()=>scr.classList.toggle('app',!isHome()));
 const T=[['Wi‑Fi','M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.500 16.500a5 5 0 0 1 7 0',1],['소리','M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6',1],['블루투스','M7 7l10 10-5 4V3l5 4L7 17',0],['손전등','M9 3h6v5l-2 3v10h-2V11L9 8z',0],['자동 회전','M20 12a8 8 0 1 1-3-6.200M20 4v4h-4',1],['비행기 모드','M21 15l-8-5V4a1 1 0 0 0-2 0v6l-8 5v2l8-2v4l-2 1v1l3-.5 3 .5v-1l-2-1v-4l8 2z',0],['위치','M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11zM12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4',1],['절전 모드','M5 19C5 9 11 5 19 5c0 9-4 14-14 14zM5 19 13 11',0],['모바일 데이터','M8 20V6M5 9l3-3 3 3M16 4v14M13 15l3 3 3-3',1],['Smart View','M3 6h18v12H3zM9 21h6',0]];
 $('tiles').innerHTML=T.map(t=>'<div class="tile'+(t[2]?' on':'')+'"><i><svg viewBox="0 0 24 24"><path d="'+t[1]+'"/></svg></i>'+t[0]+'</div>').join('');
 $('tiles').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)t.classList.toggle('on')});
 const shT=()=>{const d=new Date(),h=d.getHours();$('shT').textContent=(h%12||12)+':'+String(d.getMinutes()).padStart(2,'0');$('shD').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+'일월화수목금토'[d.getDay()]+'요일'};shT();setInterval(shT,10000);
 const open=o=>sh.classList.toggle('on',o);let y0=null;const p=$('pull');
 p.addEventListener('pointerdown',e=>{y0=e.clientY;p.setPointerCapture(e.pointerId)});
 p.addEventListener('pointermove',e=>{if(y0!==null&&e.clientY-y0>10){open(true);y0=null}});
 p.addEventListener('pointerup',()=>{if(y0!==null)open(true);y0=null});
 let y1=null;sh.addEventListener('pointerdown',e=>{y1=e.clientY});sh.addEventListener('pointerup',e=>{if(y1!==null&&y1-e.clientY>40)open(false);y1=null});
 $('clr').addEventListener('click',()=>{$('ntfs').innerHTML='<div class="ntf" style="text-align:center;opacity:.7">알림 없음</div>'});
 ['hHome','hBack'].forEach(i=>$(i).addEventListener('click',()=>open(false),true));
}
/* 물리 버튼: 가운데 홈은 홈 화면으로, 오른쪽은 한 단계 뒤로 */
if(!document.documentElement.classList.contains('emb')){
 const home=$('hHome'),back=$('hBack');
 home.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();dp.src='home.html?v=20261101-8';});
 back.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();try{const w=dp.contentWindow,homeUrl=new URL('home.html',location.href).href;if(w.location.href===homeUrl)return;let settled=false;const finish=handled=>{if(settled)return;settled=true;removeEventListener('message',onReply);clearTimeout(timer);if(!handled){try{if(w.history.length>1)w.history.back();else dp.src='home.html?v=20261101-8';}catch(_){dp.src='home.html';}}};const onReply=ev=>{if(ev.source===w&&ev.data&&ev.data.type==='backHandled')finish(!!ev.data.handled)};addEventListener('message',onReply);const timer=setTimeout(()=>finish(false),120);w.postMessage({type:'back'},'*');}catch(err){try{dp.contentWindow.history.back()}catch(_){dp.src='home.html';}}});
}
})();
