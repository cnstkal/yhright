<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>메시지</title>
<link rel="stylesheet" href="messages.css?v=20261101-3">
</head>
<body>
<div id="app">
<!-- 대화 목록 -->
<section class="view" id="vList">
<header class="bar">
<button class="tb l" data-act="edit" id="editBtn">편집</button>
<h1>메시지</h1>
<button class="ib r" data-act="compose" aria-label="새 메시지"><svg viewBox="0 0 24 24"><path d="M18.5 3.5l2 2L11 15l-3 1 1-3z"/><path d="M16 5H5a1.5 1.5 0 0 0-1.5 1.5v12A1.5 1.5 0 0 0 5 20h12a1.5 1.5 0 0 0 1.500-1.500V12"/></svg></button>
</header>
<div class="searchbar" id="searchBar"><div class="sf"><svg viewBox="0 0 24 24"><circle cx="10.500" cy="10.500" r="6"/><path d="M15 15l5.500 5.500"/></svg><input id="q" placeholder="검색" autocomplete="off"></div></div>
<ul class="list" id="list"></ul>
<p class="empty" id="empty" hidden>대화가 없습니다.</p>
<div class="foot" id="selBar" hidden><span class="selc" id="selTxt"></span><button class="tb" data-act="delsel">삭제</button></div>
</section>

<!-- 대화방 -->
<section class="view" id="vThread" hidden>
<header class="bar">
<button class="tb l back" data-act="back"><svg viewBox="0 0 12 21"><path d="M10.500 1.500 2 10.500l8.500 9"/></svg>메시지</button>
<h1 id="tName"></h1>
<button class="tb r" data-act="more">세부사항</button>
</header>
<div class="msgs" id="msgs"></div>
<div class="pend" id="tPend"></div>
<form class="composer" id="tForm">
<button type="button" class="ib cam" data-act="attach" aria-label="사진"><svg viewBox="0 0 28 22"><path d="M3 5h5l1.500-3h9L20 5h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><circle cx="14" cy="12.500" r="4.500"/></svg></button>
<div class="field"><textarea id="tIn" rows="1" placeholder="iMessage"></textarea><button class="send" type="submit">전송</button><svg class="mic" viewBox="0 0 16 24"><rect x="4.500" y="1" width="7" height="13" rx="3.500"/><path d="M1.500 11a6.500 6.500 0 0 0 13 0M8 17.500V22"/></svg></div>
</form>
</section>

<!-- 새 메시지 -->
<section class="view" id="vCompose" hidden>
<header class="bar">
<h1 id="cTitle">새로운 iMessage</h1>
<button class="tb r" data-act="cback">취소</button>
</header>
<div class="to"><span class="lbl">받는 사람:</span><div class="recips" id="recips"></div><input id="toIn" autocomplete="off"><button class="plus" data-act="pick" aria-label="연락처 선택">+</button></div>
<ul class="list sugg" id="sugg" hidden></ul>
<div class="cbody"></div>
<div class="pend" id="cPend"></div>
<div class="composer">
<button type="button" class="ib cam" data-act="cattach" aria-label="사진"><svg viewBox="0 0 28 22"><path d="M3 5h5l1.500-3h9L20 5h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><circle cx="14" cy="12.500" r="4.500"/></svg></button>
<div class="field"><textarea id="cIn" rows="1" placeholder="iMessage"></textarea><button type="button" class="send" data-act="csend">전송</button><svg class="mic" viewBox="0 0 16 24"><rect x="4.500" y="1" width="7" height="13" rx="3.500"/><path d="M1.500 11a6.500 6.500 0 0 0 13 0M8 17.500V22"/></svg></div>
</div>
</section>

<!-- 연락처 선택 -->
<section class="view" id="vPick" hidden>
<header class="bar">
<h1>연락처</h1>
<button class="tb r" data-act="pickback">취소</button>
</header>
<ul class="list" id="pickList"></ul>
</section>

<div class="pop" id="pop" hidden></div>

<div class="dim" id="dlg" hidden>
<div class="dlg">
<div class="dtx"><p id="dlgMsg"></p></div>
<div class="dlgbtns"><button id="dlgNo">취소</button><button id="dlgOk" class="red">확인</button></div>
</div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept="image/*" hidden>
</div>
<script src="../system-bar.js"></script>
<script src="messages.js?v=20261101-3"></script>
</body>
</html>
