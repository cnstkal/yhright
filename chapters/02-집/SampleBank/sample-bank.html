<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>샘플뱅크 (연출용)</title>
<link rel="stylesheet" href="sample-bank.css">
</head>
<body>
<div class="app">
  <div class="notice">샘플 화면 · 실제 금융 정보 아님</div>
  <header class="top">
    <span class="logo">샘플뱅크</span>
    <span class="menu">≡</span>
  </header>
  <section class="balance">
    <p class="label">총 잔고 (예시)</p>
    <p class="amount">0,000,000원</p>
  </section>
  <section class="cards">
    <h2>카드 이용 내역 (예시)</h2>
    <ul>
      <li><span class="name">가맹점 A</span><span class="amt">-0,000원</span></li>
      <li><span class="name">가맹점 B</span><span class="amt">-0,000원</span></li>
      <li><span class="name">가맹점 C</span><span class="amt">-0,000원</span></li>
    </ul>
  </section>
</div>
<script src="sample-bank.js"></script>
</body></html>
