<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전화</title>
<link rel="stylesheet" href="phone.css?v=20261101-5">
</head>
<body>
<div id="app">
<div class="sbar" id="sbar"><span class="sl"><i class="dots"></i>KT</span><b id="sbt">9:41</b><span class="sr">100%<i class="bat"></i></span></div>

<!-- 메인: 상단 바 + 페이지 + 하단 탭 -->
<section class="view" id="vMain">
<header class="bar" id="mainBar"></header>
<div class="pages" id="pages">
<div class="pg" id="pgFav" hidden></div>
<div class="pg" id="pgLog"></div>
<div class="pg" id="pgCon" hidden><div class="srch"><div class="sf"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg><input id="cq" placeholder="검색" autocomplete="off"></div></div><div id="conList"></div></div>
<div class="pg pad" id="pgPad" hidden>
<div class="dispnum"><div class="dn" id="dn"></div><div class="dname" id="dname"></div></div>
<div class="keys" id="keys"></div>
<div class="dbar"><button class="addc" id="addc" data-act="addnum" aria-label="연락처에 추가" hidden>+</button><button class="callb" data-act="dial" aria-label="전화"><svg viewBox="0 0 24 24" class="f"><use href="#ph"/></svg></button><button class="bs" id="bs" data-act="bs" aria-label="지우기" hidden><svg viewBox="0 0 28 20"><path d="M9 1h17a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H9L1 10zM13 6l8 8M21 6l-8 8"/></svg></button></div>
</div>
<div class="pg" id="pgVm" hidden></div>
</div>
<nav class="tabs" id="tabs">
<button data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.4 4.2 1.1 6.1L12 16.8 6.5 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg><span>즐겨찾기</span></button>
<button data-tab="log" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.500h4"/></svg><span>최근 통화</span><em class="bdg" id="bdg" hidden></em></button>
<button data-tab="con"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4.500 20.500c.8-4 4-6 7.500-6s6.700 2 7.500 6z"/></svg><span>연락처</span></button>
<button data-tab="pad"><svg viewBox="0 0 24 24" class="kp"><g><circle cx="5" cy="4" r="1.800"/><circle cx="12" cy="4" r="1.800"/><circle cx="19" cy="4" r="1.800"/><circle cx="5" cy="10" r="1.800"/><circle cx="12" cy="10" r="1.800"/><circle cx="19" cy="10" r="1.800"/><circle cx="5" cy="16" r="1.800"/><circle cx="12" cy="16" r="1.800"/><circle cx="19" cy="16" r="1.800"/><circle cx="12" cy="22" r="1.800"/></g></svg><span>키패드</span></button>
<button data-tab="vm"><svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/><path d="M7 16h10"/></svg><span>음성 사서함</span></button>
</nav>
</section>

<!-- 통화 상세 -->
<section class="view" id="vLog" hidden>
<header class="bar"><button class="tb l back" data-act="back"><svg viewBox="0 0 12 21"><path d="M10.5 1.5 2 10.5l8.5 9"/></svg>최근 통화</button><h1>통화 정보</h1></header>
<div class="det" id="logDet"></div>
</section>

<!-- 연락처 상세 -->
<section class="view" id="vCon" hidden>
<header class="bar"><button class="tb l back" data-act="back"><svg viewBox="0 0 12 21"><path d="M10.5 1.5 2 10.5l8.5 9"/></svg>연락처</button><button class="tb r" data-act="editcon">편집</button></header>
<div class="det" id="conDet"></div>
</section>

<!-- 연락처 추가/편집 -->
<section class="view" id="vEdit" hidden>
<header class="bar"><button class="tb l" data-act="edcancel">취소</button><h1 id="edTitle">새로운 연락처</h1><button class="tb r b" data-act="edsave">완료</button></header>
<div class="form">
<label><span>이름</span><input id="edName" placeholder="이름" autocomplete="off"></label>
<label><span>휴대전화</span><input id="edNum" placeholder="전화번호" inputmode="tel" autocomplete="off"></label>
<div class="row link" id="edDel" data-act="delcon" hidden>연락처 삭제</div>
</div>
</section>

<!-- 통화 중 -->
<section class="view dark call" id="vCall" hidden>
<div class="cname" id="cName"></div>
<div class="csub" id="cSub"></div>
<div class="cstat" id="cTime">00:00</div>
<div class="cav" id="cAv"></div>
<div class="cgrid" id="cGrid"></div>
<div class="ckp" id="ckp" hidden><div class="cdn" id="cdn"></div><div class="keys" id="ckeys"></div><button class="hide" data-act="hidekp">숨기기</button></div>
<button class="endb" data-act="end" aria-label="통화 종료"><svg viewBox="0 0 24 24" class="f" style="transform:rotate(135deg)"><use href="#ph"/></svg></button>
</section>

<!-- 수신 -->
<section class="view dark incoming" id="vIn" hidden>
<div class="cname" id="iName"></div>
<div class="csub" id="iSub"></div>
<div class="cstat" id="iNum"></div>
<div class="cav" id="iAv"></div>
<div class="iq"><button data-act="later"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9v4.500l3 1.500M4 6l3-3M20 6l-3-3"/></svg><span>나중에 보기</span></button><button data-act="imsg"><svg viewBox="0 0 24 24" style="fill:#fff;stroke:none"><path d="M12 3C6.500 3 2 6.600 2 11c0 2.500 1.400 4.700 3.700 6.200L4.500 21l4.300-2.200c1 .2 2.100.4 3.200.4 5.500 0 10-3.600 10-8S17.500 3 12 3z"/></svg><span>메시지</span></button></div>
<div class="ia"><div><button class="rb" data-act="decline" aria-label="거절"><svg viewBox="0 0 24 24" class="f" style="transform:rotate(135deg)"><use href="#ph"/></svg></button><span>거절</span></div><div><button class="gb" data-act="accept" aria-label="응답"><svg viewBox="0 0 24 24" class="f"><use href="#ph"/></svg></button><span>응답</span></div></div>
</section>

<div class="dim" id="sheet" hidden><div class="dlg tall"><p id="shTitle">연락처 선택</p><ul class="list" id="shList"></ul><div class="dlgbtns"><button data-act="shclose">취소</button></div></div></div>
<div class="dim" id="dlg" hidden><div class="dlg"><p id="dlgMsg"></p><div class="dlgbtns"><button id="dlgNo">취소</button><button id="dlgOk" class="red">확인</button></div></div></div>
<div class="toast" id="toast" hidden></div>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="ph" viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></symbol></defs></svg>
</div>
<script src="phone.js?v=20261101-5"></script>
</body>
</html>
