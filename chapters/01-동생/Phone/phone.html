<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>전화</title><link rel="stylesheet" href="phone.css"></head><body><main id="app">
<header class="top"><div class="status">오전 9:41　　● ● ●　100%</div><div class="head"><b>전화</b><button id="more">⋮</button></div><nav class="tabs"><button data-tab="log" class="on">최근기록</button><button data-tab="fav">즐겨찾기</button><button data-tab="contacts">연락처</button></nav></header>
<section id="log" class="page on"><div id="loglist"></div></section><section id="fav" class="page"><div id="favlist"></div></section><section id="contacts" class="page"><input id="search" placeholder="연락처 검색"><div id="contactlist"></div></section>
<section id="keypad" class="page"><div class="number" id="number"></div><div class="keys" id="keys"></div><div class="actions"><button class="message" id="sms" disabled>메시지</button><button class="dial" id="dial" disabled>☎</button><button class="erase" id="erase">⌫</button></div></section>
<section id="detail" class="overlay" hidden><button class="back" data-close>‹</button><div class="avatar" id="dAvatar">?</div><h2 id="dName"></h2><p id="dNumber"></p><div class="detail-actions"><button id="dCall">전화</button><button id="dSms">메시지</button></div><div id="dHistory"></div></section>
<section id="calling" class="overlay call" hidden><div class="call-avatar" id="cAvatar">?</div><h2 id="cName"></h2><p id="cNumber"></p><p id="callState">통화 연결 중…</p><div class="call-controls"><button id="mute">음소거</button><button id="speaker">스피커</button><button id="keyToggle">키패드</button></div><button class="end" id="end">통화 종료</button></section>
<div id="menu" hidden><button id="menuDelete">통화기록 삭제</button><button id="menuSettings">설정</button></div><div id="toast" hidden></div>
<nav class="bottom"><button data-tab="log">최근기록</button><button data-tab="contacts">연락처</button><button data-tab="keypad">키패드</button><button id="openMessages">메시지</button></nav></main><script src="phone.js"></script></body></html>
