<script>
(function(){const dv=document.getElementById('device'),dp=document.getElementById('disp');
function fit(){dv.style.setProperty('--k',Math.min(innerWidth/427,innerHeight/887,1.7).toFixed(3))}addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id);
function tick(){const d=new Date(),h=d.getHours();$('sbt').textContent=(h<12?'오전 ':'오후 ')+((h%12)||12)+':'+String(d.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,10000);
/* 앱은 Display(iframe) 안에서 일반 링크로 열린다. 물리 홈 버튼: 어떤 앱에서든 iframe을 홈 화면으로 되돌린다(뒤로가기 아님) */
const homeUrl=new URL(dp.getAttribute('src'),location.href).href;
if(!document.documentElement.classList.contains('emb')){
$('hHome').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();let cur='';try{cur=dp.contentWindow.location.href}catch(_){}if(cur!==homeUrl)dp.src=homeUrl});
}
})();
</script><script>/* iOS Safari fallback: suppress double-click zoom only. */document.addEventListener("dblclick",function(e){e.preventDefault()},{passive:false});</script><script src="../../dev-chapter-switcher.js"></script></body></html>
