<script>
(function(){const dv=document.getElementById('device'),dp=document.getElementById('disp');
function fit(){dv.style.setProperty('--k',Math.min(innerWidth/399,innerHeight/813,1.7).toFixed(3))}addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id);
function tick(){const d=new Date(),h=d.getHours(),t=(h%12||12)+':'+String(d.getMinutes()).padStart(2,'0'),a=h<12?'오전':'오후';
$('tm').textContent=t;$('ap').textContent=a;$('sbt').textContent=a+' '+t;$('dt').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+'일월화수목금토'[d.getDay()]+'요일';$('cw').textContent='일월화수목금토'[d.getDay()];$('cd').textContent=d.getDate()}
tick();setInterval(tick,10000);
/* 물리 버튼: 홈 = 홈 화면으로, 뒤로 = 디스플레이 내 뒤로가기 */
function hw(id,fn){const e=$(id);if(e&&!document.documentElement.classList.contains('emb'))e.addEventListener('click',fn)}
hw('hHome',()=>{try{dp.contentWindow.location.replace('home.html')}catch(e){dp.src='home.html'}});
hw('hBack',()=>{try{dp.contentWindow.history.back()}catch(e){}})})();
</script></body></html>
