<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>2016 · 홈 화면</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:white}body{background:linear-gradient(145deg,#83b9ed,#b5a4e8 52%,#f0a7c4)}main{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}header{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-size:14px;font-weight:600}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 8px;padding:24px 0}.app{color:white;text-decoration:none;text-align:center;font-size:11px;text-shadow:0 1px 3px #0006}.ico{width:min(17vw,66px);height:min(17vw,66px);margin:0 auto 6px;border-radius:15px;display:grid;place-items:center;font-size:29px;box-shadow:0 2px 5px #0003;background:linear-gradient(145deg,#ffffffaa,#ffffff44)}.green{background:linear-gradient(#b8ed9c,#69bf50)}.phone{background:linear-gradient(#8be0a4,#31b765)}.photo{background:linear-gradient(145deg,#fff,#e8e8f4)}.note{background:linear-gradient(#fff6b8,#f4d95b)}.spacer{flex:1}.dots{text-align:center;font-size:10px;letter-spacing:5px;margin-bottom:14px}.dock{height:88px;border-radius:25px;background:#ffffff45;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-evenly;margin-bottom:12px}.dock .ico{width:54px;height:54px;margin:0}.indicator{height:5px;width:108px;background:#fff;border-radius:9px;margin:0 auto 4px}
</style></head><body><main><header><span id="clock">9:41</span><span>●●● ◉ ▰</span></header><section class="apps">
<a class="app" href="apps/messages.html"><div class="ico green">✉</div>메시지</a>
<a class="app" href="apps/phone.html"><div class="ico phone">☎</div>전화</a>
<a class="app" href="apps/photos.html"><div class="ico photo">🌼</div>사진</a>
<a class="app" href="apps/notes.html"><div class="ico note">▤</div>메모</a>
</section><div class="spacer"></div><div class="dots">● ○</div><nav class="dock"><a class="app" href="apps/phone.html"><div class="ico phone">☎</div></a><a class="app" href="apps/messages.html"><div class="ico green">✉</div></a><a class="app" href="apps/photos.html"><div class="ico photo">🌼</div></a><a class="app" href="apps/notes.html"><div class="ico note">▤</div></a></nav><div class="indicator"></div></main><script>const c=document.getElementById('clock');function tick(){const d=new Date();c.textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')}tick();setInterval(tick,10000)</script>
<!-- chapter-switcher -->
<style>
#chapter-switch{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:2147483000;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#chapter-switch button{border:1px solid rgba(255,255,255,.28);background:rgba(28,30,36,.48);color:#fff;border-radius:18px;padding:6px 10px;font-size:10px;font-weight:650;letter-spacing:.04em;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 2px 10px #0002}
#chapter-switch-panel{display:none;position:absolute;right:0;bottom:36px;min-width:142px;padding:6px;border:1px solid #ffffff24;border-radius:14px;background:rgba(28,30,36,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 28px #0004}
#chapter-switch-panel.open{display:block}
#chapter-switch-panel a{display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:9px;color:#fff;text-decoration:none;font-size:12px;white-space:nowrap}
#chapter-switch-panel a.current{background:#ffffff20}
#chapter-switch-panel a span{font-size:9px;opacity:.58}
@media(prefers-reduced-motion:no-preference){#chapter-switch-panel{transform:translateY(4px);opacity:0;transition:opacity .14s,transform .14s}#chapter-switch-panel.open{transform:translateY(0);opacity:1}}
</style>
<div id="chapter-switch">
 <div id="chapter-switch-panel" aria-hidden="true">
  <a class="current" href="home.html">CH 01 <span>현재 챕터</span></a>
  <a href="../02-집/home.html">CH 02 · 집 <span>이동하기</span></a>
 </div>
 <button type="button" id="chapter-switch-toggle" aria-expanded="false" aria-controls="chapter-switch-panel">CH 01⌄</button>
</div>
<script>
(()=>{const root=document.getElementById('chapter-switch'),btn=document.getElementById('chapter-switch-toggle'),panel=document.getElementById('chapter-switch-panel');if(!root||!btn||!panel)return;const close=()=>{panel.classList.remove('open');panel.setAttribute('aria-hidden','true');btn.setAttribute('aria-expanded','false')};btn.addEventListener('click',e=>{e.stopPropagation();const open=!panel.classList.contains('open');panel.classList.toggle('open',open);panel.setAttribute('aria-hidden',String(!open));btn.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!root.contains(e.target))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()})})();
</script>

</body></html>
