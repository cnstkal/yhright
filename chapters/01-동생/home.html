<script>
(function(){const dv=document.getElementById('device'),dp=document.getElementById('disp');
function fit(){dv.style.setProperty('--k',Math.min(innerWidth/399,innerHeight/813,1.7).toFixed(3))}addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id);
function tick(){const d=new Date(),h=d.getHours(),t=(h%12||12)+':'+String(d.getMinutes()).padStart(2,'0'),a=h<12?'오전':'오후';
$('tm').textContent=t;$('ap').textContent=a;$('sbt').textContent=a+' '+t;$('dt').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+'일월화수목금토'[d.getDay()]+'요일';if($('cw'))$('cw').textContent='일월화수목금토'[d.getDay()];if($('cd'))$('cd').textContent=d.getDate()}
tick();setInterval(tick,10000);
/* 물리 버튼: 가운데 홈은 홈 화면으로, 오른쪽은 한 단계 뒤로 */
if(!document.documentElement.classList.contains('emb')){
 const home=$('hHome'),back=$('hBack');
 home.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();dp.src='home.html?v=20261101-4';});
 back.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();try{const w=dp.contentWindow,homeUrl=new URL('home.html',location.href).href;if(w.location.href===homeUrl)return;let settled=false;const finish=handled=>{if(settled)return;settled=true;removeEventListener('message',onReply);clearTimeout(timer);if(!handled){try{if(w.history.length>1)w.history.back();else dp.src='home.html?v=20261101-4';}catch(_){dp.src='home.html';}}};const onReply=ev=>{if(ev.source===w&&ev.data&&ev.data.type==='backHandled')finish(!!ev.data.handled)};addEventListener('message',onReply);const timer=setTimeout(()=>finish(false),120);w.postMessage({type:'back'},'*');}catch(err){try{dp.contentWindow.history.back()}catch(_){dp.src='home.html';}}});
}
})();
</script><script src="../../dev-chapter-switcher.js?v=20261101-2"></script>
