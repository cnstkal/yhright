<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>음악</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#171719;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;padding:22px 16px}header{font-size:22px;font-weight:800;padding:12px 0}h1{font-size:30px}h2{margin-top:26px}p,small{color:#85858c}.card,.row,article,section{background:white;border-radius:15px;padding:17px;margin:12px 0}.card{height:130px;background:linear-gradient(135deg,#f5c2cf,#b7b3ed);font-size:22px;font-weight:700}.row{padding:15px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:18px;text-align:center;border-top:1px solid #ddd}.video{height:170px;border-radius:12px;background:linear-gradient(135deg,#25252a,#777);display:grid;place-items:center;color:#fff;margin-top:16px}article{font-weight:700}button{border:0;border-radius:9px;background:#315fca;color:#fff;padding:12px 18px}select,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:7px 0;font:inherit}textarea{height:100px}.hero{padding:35px 20px;border-radius:16px;background:#343e70;color:#fff;font-size:22px;line-height:1.7}</style></head><body><h1>지금 듣기</h1><p>회원님을 위한 음악</p><div class='card'>오늘의 믹스<br><small>취향에 맞는 음악을 모았어요</small></div><h2>최근 재생</h2><div class='row'>▶　밤의 편지　<small>아이유</small></div><div class='row'>▶　별 보러 가자　<small>적재</small></div><div class='row'>▶　파도　<small>폴킴</small></div><nav>지금 듣기　찾아보기　라디오　보관함</nav></body></html>
