<script>
(function(){
const emb=document.documentElement.classList.contains('emb'),$=id=>document.getElementById(id);
function tick(){const d=new Date(),h=d.getHours();$('sbt').textContent=(h%12||12)+':'+String(d.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,10000);
if(emb)return;

/* 기기 크기를 창에 맞춤 */
const dv=$('device'),scr=$('screen'),hb=$('hBar');
function fit(){dv.style.setProperty('--k',Math.min(innerWidth/480,innerHeight/960,1.4).toFixed(3))}
addEventListener('resize',fit);fit();

/* 디스플레이(iframe): 홈 화면과 모든 앱이 이 안에서 열림 */
const dp=document.createElement('iframe');dp.id='disp';dp.title='display';dp.src='home.html';scr.insertBefore(dp,scr.firstChild);

function atHome(){try{return /\/home\.html$/.test(dp.contentWindow.location.pathname)}catch(e){return true}}
function lum(c){const m=(c||'').match(/[\d.]+/g);if(!m||m.length<3)return null;if(m.length>3&&+m[3]===0)return null;return(.2126*m[0]+.7152*m[1]+.0722*m[2])/255}
/* 홈이면 흰 인디케이터, 앱이면 앱 배경색에 맞춰 흑/백 + 아래 띠 색 */
function tone(){
 const home=atHome();dv.classList.toggle('at-home',home);
 if(home){dv.classList.add('light');scr.style.background='#fff';return}
 let bg=null,l=null;
 try{const d=dp.contentDocument;for(const el of[d.body,d.documentElement]){const c=getComputedStyle(el).backgroundColor;if(lum(c)!==null){bg=c;l=lum(c);break}}}catch(e){}
 if(l===null)l=1;
 scr.style.background=bg||'#fff';dv.classList.toggle('light',l<.4)}
dp.addEventListener('load',tone);setInterval(tone,500);

/* 홈 버튼 역할: 인디케이터를 누르거나 위로 쓸어올리면 홈 화면으로 */
/* 앱 열기/닫기: 짧고 가벼운 스케일+페이드 모션 */
const EASE='cubic-bezier(.2,.8,.2,1)';
function goHome(){if(atHome())return;dp.style.transition=`transform .2s ${EASE}, opacity .18s ease`;dp.style.transform='scale(.96)';dp.style.opacity='0';setTimeout(()=>{dp.style.transition='none';dp.src='home.html'},190)}
/* 하단 탭바: 인디케이터 높이(34px)만큼 아이콘을 위로 올려 인디케이터와 겹치지 않게 (바 자체는 맨 아래까지 연장) */
function fitBottom(){try{const d=dp.contentDocument;if(!d||!d.body||d.body.dataset.hb)return;d.body.dataset.hb='1';const W=dp.clientWidth,H=dp.clientHeight;
const all=[...d.body.querySelectorAll('*')].filter(e=>{const r=e.getBoundingClientRect(),cs=getComputedStyle(e);return r.width>=W*.9&&r.height>=36&&r.height<=140&&Math.abs(r.bottom-H)<=2&&cs.display!=='none'&&cs.visibility!=='hidden'});
const top=all.filter(e=>!all.some(o=>o!==e&&o.contains(e)));
top.forEach(e=>{const r=e.getBoundingClientRect(),pb=parseFloat(getComputedStyle(e).paddingBottom)||0;e.style.boxSizing='border-box';e.style.height=(r.height+34)+'px';e.style.paddingBottom=(pb+34)+'px'})}catch(e){}}
dp.addEventListener('load',()=>{if(!atHome())fitBottom()});
dp.addEventListener('load',()=>{if(atHome()){dp.style.transition='none';dp.style.transform='';dp.style.opacity='';return}dp.style.transition='none';dp.style.transform='scale(1.02)';dp.style.opacity='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{dp.style.transition=`transform .26s ${EASE}, opacity .2s ease`;dp.style.transform='scale(1)';dp.style.opacity='1'}))});
let y0=null,moved=false;
hb.addEventListener('pointerdown',e=>{y0=e.clientY;moved=false;try{hb.setPointerCapture(e.pointerId)}catch(_){}});
hb.addEventListener('pointermove',e=>{if(y0!=null&&y0-e.clientY>20){moved=true;y0=null;goHome()}});
hb.addEventListener('pointerup',()=>{if(y0!=null&&!moved)goHome();y0=null});
hb.addEventListener('pointercancel',()=>{y0=null});
hb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goHome()}});
})();
</script>
