<style>
/* YouTube iOS 앱 스타일 (홈 · 쇼츠 · 구독 · 보관함 · 설정) + 재생 화면 */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#fff;--fg:#0f0f0f;--sub:#606060;--chip:#f2f2f2;--line:#e5e5e5;--act:#0f0f0f;--actfg:#fff;--red:#ff0000;--link:#065fd4}
body[data-th=dark]{--bg:#0f0f0f;--fg:#f1f1f1;--sub:#aaaaaa;--chip:#272727;--line:#303030;--act:#f1f1f1;--actfg:#0f0f0f;--link:#3ea6ff}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Pretendard",sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dots circle{fill:currentColor;stroke:none}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,20px)}
html.emb #app{padding-top:44px}
#hdr{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
#hdr .rt{display:flex;align-items:center;gap:6px}
.logo{display:flex;align-items:center;gap:5px;font-weight:800;font-size:22px;letter-spacing:-.7px}
.yt{width:32px;height:22px;border-radius:7px;background:var(--red);position:relative;flex:none}
.yt:after{content:"";position:absolute;left:12px;top:5px;border-left:8px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.ib{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.ib svg{width:24px;height:24px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none;overflow:hidden}
.ttl{font-size:26px;font-weight:800;padding:8px 14px 4px;letter-spacing:-.4px}

#view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px}
#tabs{flex:none;height:calc(54px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--bg);border-top:.5px solid var(--line)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--fg);opacity:.7}
#tabs button.on{opacity:1}
#tabs svg{width:24px;height:24px}
#tabs button.on svg{fill:currentColor}

.chips{display:flex;gap:10px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:9px;background:var(--chip);font-size:14px;display:flex;align-items:center;white-space:nowrap;color:var(--fg)}
.chip.on{background:var(--act);color:var(--actfg);font-weight:600}

.th{position:relative;width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.35);overflow:hidden;text-align:center;padding:0 12px}
.th .d{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:600;padding:2px 5px;border-radius:4px;text-shadow:none}
.th .sb{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;text-shadow:none}
.th .pr{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3)}.th .pr i{display:block;height:100%;background:var(--red)}
.vid{margin-bottom:22px}
.vm{display:flex;gap:12px;padding:12px 14px 0;align-items:flex-start}
.vm .av{width:36px;height:36px;font-size:15px}
.vm .t{flex:1;min-width:0}
.vm .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:20px;font-weight:600}
.vm .t span{display:block;font-size:13px;color:var(--sub);margin-top:3px;line-height:18px}
.vm .kb{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center}
.vm .kb svg{width:20px;height:20px}

.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 14px 8px}
.sec b{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.sec b svg{width:24px;height:24px}
.sec .lk{font-size:15px;color:var(--link);font-weight:500}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.hc{flex:none;width:210px;position:relative}
.hc .th{border-radius:10px;font-size:16px}
.hc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:19px;font-weight:500;margin-top:8px}
.hc span{display:block;font-size:12px;color:var(--sub);margin-top:3px}
.pls{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px 6px}
.pls .th{border-radius:10px;font-size:15px;flex-direction:column;gap:6px;background:#2b3442!important}
.pls b{display:block;font-size:14px;font-weight:500;margin-top:8px}
.pls span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.lr{display:flex;align-items:center;gap:16px;padding:16px 14px;font-size:16px;border-top:.5px solid var(--line);color:var(--fg)}
.lr svg{width:24px;height:24px;flex:none}
.lr.sp2{margin-top:6px}

.chn-row{display:flex;gap:14px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}.chn-row::-webkit-scrollbar{display:none}
.chn{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.chn .av{width:66px;height:66px;font-size:24px;position:relative}
.chn .nw{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#3ea6ff;border:2px solid var(--bg)}
.chn.all{color:var(--link);font-size:14px;justify-content:center;font-weight:500;width:56px;margin-top:20px}
.chips.box{margin:4px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 14px}

.shgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.sh{aspect-ratio:9/16;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* 재생 화면 */
#pl{position:fixed;inset:0;z-index:50;background:#0f0f0f;color:#f1f1f1;display:flex;flex-direction:column;overflow:hidden}
#pl[hidden]{display:none}
#pl .scr{flex:1;min-height:0;overflow-y:auto;padding-bottom:20px;-webkit-overflow-scrolling:touch}
.pbox{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;padding-top:calc(env(safe-area-inset-top,0px) * 0)}
.pbox .pg{position:absolute;inset:0}
.pbox .pbtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:8px 12px;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.pbox .pbtop .sp{flex:1}
.pbox .pbtop button{color:#fff;display:flex}
.pbox .pbtop svg{width:24px;height:24px}
.pbox .pbmid{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;padding:0 18%;pointer-events:none}
.pbox .pbmid button{pointer-events:auto;color:#fff;display:flex;align-items:center;justify-content:center}
.pbox .pbmid svg{width:34px;height:34px}
.pbox .pbmid .big svg{width:52px;height:52px}
.pbox .pbmid .big svg{fill:currentColor;stroke:none}
.pbox .pbmid .big svg.s{fill:none;stroke:currentColor;stroke-width:1.8}
.pbox .cap{position:absolute;left:10%;right:10%;bottom:34px;text-align:center;color:#fff;font-size:15px;line-height:1.35;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:4px;display:none}
.pbox .cap.on{display:block}
.pbox .pbbot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:0 12px 10px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.pbox .pbbot .sp{flex:1}
.pbox .pbbot button{color:#fff;display:flex}
.pbox .pbbot svg{width:18px;height:18px}
.pbox .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3)}
.pbox .prog i{display:block;height:100%;width:0;background:var(--red)}
.pinfo{padding:12px 14px 0}
.pinfo h1{font-size:17px;line-height:23px;font-weight:600}
.pinfo .meta{font-size:13px;color:#aaa;margin-top:4px}
.pacts{display:flex;gap:6px;overflow-x:auto;margin:14px -14px 0;padding:0 14px 12px;border-bottom:.5px solid #303030;scrollbar-width:none}.pacts::-webkit-scrollbar{display:none}
.pact{flex:none;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#f1f1f1;padding:8px 6px;border-radius:10px}
.pact svg{width:22px;height:22px}
.pact.on{color:#3ea6ff}.pact.on svg{fill:currentColor}
.pact .pill{height:36px;width:70px;border-radius:18px;background:#272727;display:flex;align-items:center;justify-content:center}
.pch{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid #303030}
.pch .av{width:40px;height:40px;font-size:17px}
.pch .t{flex:1;min-width:0}
.pch .t b{display:block;font-size:15px;font-weight:600}
.pch .t span{font-size:12px;color:#aaa}
.pch .sbtn{height:36px;padding:0 14px;border-radius:18px;background:#e62117;color:#fff;font-weight:600;font-size:14px}
.pch .sbtn.on{background:#272727;color:#f1f1f1}
.pnote{font-size:13px;color:#aaa;padding:12px 0;border-bottom:.5px solid #303030}
.pnote a{color:#3ea6ff;text-decoration:none}
.rel{padding-top:12px}
.rel .vid{margin-bottom:18px}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:99;display:none;white-space:nowrap}
body[data-th=light] #tabs{background:#fff}

/* iPhone 노치 안전 영역 (emb 모드) */
html.emb .ib{width:36px;height:36px}
</style>
</head>

 arrow:'<path d="M9 6l6 6-6 6"/>'
};
const ico=(n,cls='')=>`<svg viewBox="0 0 24 24" class="${cls}">${IC[n]}</svg>`;

/* 영상 데이터 */
const V=[
 {id:'v1',t:'ATEEZ(에이티즈) 공식 뮤직비디오',ch:'ATEEZ Official',views:'120만회',ago:'2일 전',dur:'3:52',g:['#5b6b8f','#c2603a'],label:'ATEEZ',cc:'화려한 무대와 함께 돌아온 에이티즈',lk:48000,sub:0},
 {id:'v2',t:'믿기 힘든 자연 낙원, 호수 카약 여행',ch:'자연 탐험',views:'210만회',ago:'2주 전',dur:'19:13',g:['#2e6f8e','#8fc1b8'],label:'자연 낙원',cc:'수정처럼 맑은 호수 위를 가로지르며',lk:92000,sub:0},
 {id:'v3',t:'나의 새 셋업 – 미니멀 & 생산성',ch:'TechMax',views:'25만회',ago:'5일 전',dur:'14:28',g:['#3b3b4f','#8a7f73'],label:'SETUP',cc:'군더더기 없이 정리한 작업 공간',lk:7300,sub:0},
 {id:'v4',t:'오늘의 브이로그 · 주말 카페 투어',ch:'일상 한 스푼',views:'8.2만회',ago:'1주 전',dur:'9:40',g:['#e8b87a','#b5654a'],label:'VLOG',cc:'좋아하는 카페를 찾아가는 주말',lk:3100,sub:0},
 {id:'v5',t:'Apple 이벤트 — 10월 13일 (iPhone 12 Pro)',ch:'Apple',views:'124만회',ago:'2시간 전',dur:'1:10:58',g:['#1d1d1f','#6e6e73'],label:'Apple',cc:'Make movies like the movies',lk:924000,sub:0},
 {id:'v6',t:'나의 첫 번째 게임 공략 – 라운드 1',ch:'게임왕 지훈',views:'8.8만회',ago:'15분 전',dur:'10:28',g:['#2a4bd6','#0b1a52'],label:'NINJA',cc:'오늘은 새 스킨으로 도전!',lk:5400,sub:1},
 {id:'v7',t:'LUCKY - 첫 번째 라이브 클립 (홍대 클럽 공연)',ch:'LUCKY OFFICIAL',views:'3.8만회',ago:'3주 전',dur:'4:12',g:['#282536','#a94e45'],label:'LUCKY LIVE',cc:'작은 무대에서 시작한 래퍼 럭키의 라이브',lk:4200,sub:1},
 {id:'v8',t:'공연 끝나고 짧은 인터뷰 | LUCKY',ch:'LUCKY OFFICIAL',views:'1.2만회',ago:'1주 전',dur:'6:34',g:['#49343a','#d28b65'],label:'AFTER SHOW',cc:'무대 아래에서 만난 김홍중',lk:1800,sub:1}
];
const CHN=[{n:'지수TV',g:['#c9a0dc','#6c5b7b'],nw:1},{n:'헬로맨',g:['#fff','#9aa'],nw:1},{n:'요리왕',g:['#7fb77e','#3a6b3a'],nw:0},{n:'여행자',g:['#f2a65a','#c0392b'],nw:0},{n:'Ninja',g:['#2a4bd6','#0b1a52'],nw:1}];
const SHORTS=[{t:'엄마 오리가 새끼를 구해요!',g:['#2f7c86','#6fb8c1']},{t:'재미있는 농담 한 스푼',g:['#6b3b5e','#b06b96']},{t:'오늘의 한 줄 팁',g:['#2f5e3c','#6aa36e']},{t:'1분 요리 레시피',g:['#a4523a','#e8a07a']}];

const S={tab:'home',chip:'전체',liked:{},disliked:{},subs:{},saved:{},pid:null,cur:0,playing:false,cc:false,timer:null};
const byId=id=>V.find(v=>v.id===id);
const ini=s=>String(s||'?').replace(/[^A-Za-z가-힣0-9]/g,'').charAt(0)||'?';

const secs=d=>d.split(':').reduce((a,x)=>a*60+(+x),0);
const fmtT=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(c)}`:`${m}:${p(c)}`};

/* 상단 바 */
function hdr(kind){
 const logo=`<span class="logo"><i class="yt"></i>YouTube</span>`;
 const av=`<span class="av" style="width:30px;height:30px;font-size:14px;background:linear-gradient(135deg,#8fb3d9,#4a6f96)" data-a="toast" data-m="계정 전환은 준비 중입니다">나</span>`;
 const btn=(n,a,m)=>`<button class="ib" data-a="${a}" ${m?`data-m="${m}"`:''}>${ico(n)}</button>`;
 let r='';
 if(kind==='home')r=btn('cast','toast','기기 연결은 지원하지 않습니다')+btn('bell','toast','새 알림이 없습니다')+btn('search','toast','검색은 준비 중입니다')+av;
 if(kind==='subs')r=btn('cast','toast','기기 연결은 지원하지 않습니다')+btn('cam','toast','동영상 만들기는 준비 중입니다')+btn('search','toast','검색은 준비 중입니다')+av;
 if(kind==='lib')r=btn('search','toast','검색은 준비 중입니다')+av;
 return `${logo}<div class="rt">${r}</div>`;
}

/* 공통 카드 */
function vidCard(v){
 return `<div class="vid"><div class="th" data-a="open" data-v="${v.id}" style="background:${gradBg(v.g)}"><span>${esc(v.label)}</span><span class="d">${v.dur}</span></div>
 <div class="vm">${avatar(v.g,v.ch,36)}<div class="t"><b>${esc(v.t)}</b><span>${esc(v.ch)} · ${esc(v.views)} · ${esc(v.ago)}</span></div><button class="kb" data-a="toast" data-m="메뉴는 준비 중입니다">${ico('more','dots')}</button></div></div>`;
}
const chipsH=(list,on,act)=>`<div class="chips">${list.map(c=>`<button class="chip ${c===on?'on':''}" data-a="${act}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;

/* 화면: 홈 */
function homeV(){
 return chipsH(['전체','음악','뉴스','게임','요리','여행'],S.chip,'chip')+V.map(vidCard).join('');
}
/* 화면: 쇼츠 */
function shortsV(){
 return `<div class="ttl">쇼츠</div><div class="shgrid">${SHORTS.map(s=>`<div class="sh" style="background:${gradBg(s.g)}" data-a="toast" data-m="쇼츠는 준비 중입니다">${esc(s.t)}</div>`).join('')}</div>`;
}
/* 화면: 구독 (다크) */
function subsV(){
 const list=V.filter(v=>v.sub||v.id==='v1');
 return `<div class="chn-row">${CHN.map(c=>`<div class="chn"><span class="av" style="background:${gradBg(c.g)}">${esc(ini(c.n))}${c.nw?'<i class="nw"></i>':''}</span>${esc(c.n)}</div>`).join('')}<button class="chn all" data-a="toast" data-m="전체 구독 채널 보기는 준비 중입니다">전체</button></div>
 ${chipsH(['전체','오늘','시청 중','미시청'],S.subChip||'전체','subchip')}${list.map(vidCard).join('')}`;
}
/* 화면: 보관함 */
function libV(){
 const hist=V.slice(0,3);
 return `<div class="sec"><b>${ico('subs')}기록</b><button class="lk" data-a="toast" data-m="전체 기록 보기는 준비 중입니다">전체보기</button></div>
 <div class="hs">${hist.map(v=>`<div class="hc"><div class="th" data-a="open" data-v="${v.id}" style="background:${gradBg(v.g)}"><span>${esc(v.label)}</span><span class="d">${v.dur}</span></div><b>${esc(v.t)}</b><span>${esc(v.ch)} · ${esc(v.ago)}</span></div>`).join('')}</div>
 <div class="sec"><b>${ico('list')}재생목록</b></div>
 <div class="pls"><div><div class="th" style="background:linear-gradient(#1c2a46,#0d1424)"><span>${ico('play')}</span><span style="font-size:13px;font-weight:600">1개의 동영상</span></div><b>나중에 볼 동영상</b><span>재생목록</span></div>
 <div><div class="th" style="background:#8a8a8e"><span>${ico('thumb')}</span></div><b>좋아요 표시한 동영상</b><span>재생목록 · ${Object.keys(S.liked).filter(k=>S.liked[k]).length}개</span></div></div>
 <button class="lr sp2" data-a="toast" data-m="내 동영상은 준비 중입니다">${ico('play')}내 동영상</button>
 <button class="lr" data-a="toast" data-m="내 영화 및 TV는 준비 중입니다">${ico('film')}내 영화 및 TV</button>`;
}
/* 화면: 설정 */
function setV(){
 const items=['계정','알림','재생','개인정보 보호','도움말'];
 return `<div class="ttl">설정</div>${items.map(n=>`<button class="lr" data-a="toast" data-m="${n} 설정은 준비 중입니다" style="width:100%">${n}<span style="flex:1"></span>${ico('arrow')}</button>`).join('')}`;
}

const TABS=[['home','홈','home'],['shorts','쇼츠','shorts'],['subs','구독','subs'],['lib','보관함','lib'],['set','설정','gear']];
function render(){
 const th=S.tab==='subs'?'dark':'light';
 document.body.dataset.th=th;
 $('#hdr').innerHTML=hdr(S.tab==='subs'?'subs':S.tab==='lib'?'lib':S.tab==='set'?'x':'home');
 if(S.tab==='set')$('#hdr').innerHTML=`<span class="logo"><i class="yt"></i>YouTube</span>`;
 if(S.tab==='shorts')$('#hdr').innerHTML=`<span class="logo"><i class="yt"></i>YouTube</span><div class="rt">${`<button class="ib" data-a="toast" data-m="검색은 준비 중입니다">${ico('search')}</button>`}</div>`;
 const v=$('#view');v.innerHTML={home:homeV,shorts:shortsV,subs:subsV,lib:libV,set:setV}[S.tab]();
 v.scrollTop=0;
 $('#tabs').innerHTML=TABS.map(([k,l,i])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-t="${k}">${ico(i)}<span>${l}</span></button>`).join('');
}

/* 재생 화면 */
function openPl(id){
 const v=byId(id);if(!v)return;
 S.pid=id;S.cur=0;S.playing=true;S.cc=false;
 clearInterval(S.timer);S.timer=setInterval(tick,1000);
 const p=$('#pl');p.hidden=false;p.dataset.th='dark';
 renderPl();
}
function closePl(){clearInterval(S.timer);S.timer=null;S.pid=null;$('#pl').hidden=true;$('#pl').innerHTML=''}
function tick(){
 const v=byId(S.pid);if(!v)return;const ds=secs(v.dur);
 if(!S.playing)return;
 S.cur=Math.min(ds,S.cur+1);
 if(S.cur>=ds)S.playing=false;
 updPl();
}
function renderPl(){
 const v=byId(S.pid),ds=secs(v.dur),liked=!!S.liked[v.id],dis=!!S.disliked[v.id],subd=!!S.subs[v.ch];
 const rel=V.filter(x=>x.id!==v.id);
 $('#pl').innerHTML=`<div class="scr">
 <div class="pbox">
  <div class="pg" style="background:${gradBg(v.g)}"></div>
  <div class="pbtop"><button data-a="plclose" aria-label="닫기">${ico('down')}</button><span class="sp"></span><button data-a="toast" data-m="기기 연결은 지원하지 않습니다">${ico('cast')}</button><button data-a="cc" aria-label="자막">${ico('cc')}</button><button data-a="toast" data-m="메뉴는 준비 중입니다">${ico('more','dots')}</button></div>
  <div class="pbmid"><button data-a="prev" aria-label="이전">${ico('prev')}</button><button class="big" data-a="pp" id="ppb"></button><button data-a="next" aria-label="다음">${ico('next')}</button></div>
  <div class="cap" id="cap">${esc(v.cc)}</div>
  <div class="pbbot"><span id="tm"></span><span class="sp"></span><button data-a="toast" data-m="전체 화면은 준비 중입니다">${ico('full')}</button></div>
  <div class="prog"><i id="pr"></i></div>
 </div>
 <div class="pinfo">
  <h1>${esc(v.t)}</h1>
  <div class="meta">${esc(v.views)} 조회수 · ${esc(v.ago)}</div>
  <div class="pacts">
   <button class="pact ${liked?'on':''}" data-a="like"><span class="pill">${ico('like')}</span><span>${kfmt(v.lk+(liked?1:0))}</span></button>
   <button class="pact ${dis?'on':''}" data-a="dislike"><span class="pill">${ico('dislike')}</span><span>싫어요</span></button>
   <button class="pact" data-a="toast" data-m="공유는 준비 중입니다"><span class="pill">${ico('share')}</span><span>공유</span></button>
   <button class="pact" data-a="toast" data-m="다운로드는 준비 중입니다"><span class="pill">${ico('dl')}</span><span>다운로드</span></button>
   <button class="pact" data-a="toast" data-m="보관함에 저장했습니다"><span class="pill">${ico('save')}</span><span>저장</span></button>
  </div>
  <div class="pch">${avatar(v.g,v.ch,40)}<div class="t"><b>${esc(v.ch)}</b><span>${subd?'구독자 10.4만명':'구독자 10만명'}</span></div><button class="sbtn ${subd?'on':''}" data-a="sub">${subd?'구독 중':'구독'}</button></div>
  <div class="pnote">댓글 사용 중지됨 · <a href="#" data-a="toast" data-m="댓글 설정은 준비 중입니다">더 알아보기</a></div>
  <div class="rel">${rel.map(vidCard).join('')}</div>
 </div></div>`;
 updPl();
}
function updPl(){
 const v=byId(S.pid);if(!v)return;const ds=secs(v.dur);
 const b=$('#ppb');if(b)b.innerHTML=ico(S.playing?'pause':'play');
 const tm=$('#tm');if(tm)tm.textContent=`${fmtT(S.cur)} / ${fmtT(ds)} · ${v.ch}`;
 const pr=$('#pr');if(pr)pr.style.width=(S.cur/ds*100)+'%';
 const cap=$('#cap');if(cap)cap.classList.toggle('on',S.cc);
 const cc=document.querySelector('[data-a="cc"]');if(cc)cc.style.color=S.cc?'#3ea6ff':'#fff';
}

/* 이벤트 */
const A={
 tab:d=>{S.tab=d.t;render()},
 chip:d=>{S.chip=d.c;render()},
 subchip:d=>{S.subChip=d.c;render()},
 open:d=>openPl(d.v),
 plclose:()=>closePl(),
 pp:()=>{const v=byId(S.pid);if(S.cur>=secs(v.dur)){S.cur=0}S.playing=!S.playing;updPl()},
 prev:()=>{S.cur=Math.max(0,S.cur-10);updPl()},
 next:()=>{const ds=secs(byId(S.pid).dur);S.cur=Math.min(ds,S.cur+10);updPl()},
 cc:()=>{S.cc=!S.cc;updPl()},
 like:()=>{const id=S.pid;S.liked[id]=!S.liked[id];if(S.liked[id])S.disliked[id]=false;renderPl();restoreScroll()},
 dislike:()=>{const id=S.pid;S.disliked[id]=!S.disliked[id];if(S.disliked[id])S.liked[id]=false;renderPl();restoreScroll()},
 sub:()=>{const ch=byId(S.pid).ch;S.subs[ch]=!S.subs[ch];renderPl();restoreScroll()},
 toast:d=>toast(d.m||'')
};
let keepY=0;
function restoreScroll(){const s=document.querySelector('#pl .scr');if(s)s.scrollTop=keepY}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const f=A[t.dataset.a];if(!f)return;
 e.preventDefault();
 const sc=document.querySelector('#pl .scr');keepY=sc?sc.scrollTop:0;
 if(t.dataset.a==='open'&&!$('#pl').hidden){}
 f(t.dataset);
});
/* 재생 화면 안에서 연관 영상 누르면 바로 다른 영상으로 */
$('#pl').addEventListener('click',e=>{
 const t=e.target.closest('[data-a="open"]');if(!t)return;
 e.stopImmediatePropagation();e.preventDefault();
 openPl(t.dataset.v);$('#pl .scr').scrollTop=0;
},true);
$('#pl').addEventListener('click',e=>{
 if(e.target.closest('.pbox .pg, .pbox .pbmid, .pbox .pbbot')&&!e.target.closest('button')){A.pp()}
});
render();
</script>
<script src="../system-bar.js"></script>
</body></html>
