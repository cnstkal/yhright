<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>카카오톡</title>
<link rel="stylesheet" href="kakaotalk.css?v=20190105-3">
<style>@import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css");*,*::before,*::after{font-family:"Pretendard",sans-serif!important}</style></head>
<body>
<div id="ktApp">
  <div class="kt-sbar" id="ktSbar"><span class="kt-sl"><i class="kt-dots"></i>KT</span><b id="ktClock">9:41</b><span class="kt-sr">100%<i class="kt-bat"></i></span></div>

  <section class="kt-view" id="ktMain">
    <header class="kt-bar" id="ktBar"></header>
    <div class="kt-pages">
      <div class="kt-pg" id="ktPgFriends"></div>
      <div class="kt-pg" id="ktPgChats" hidden></div>
    </div>
    <nav class="kt-tabs" id="ktTabs">
      <button data-tab="friends" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c.6-4.6 4-7 8-7s7.400 2.400 8 7z"/></svg><span>친구</span></button>
      <button data-tab="chats"><svg viewBox="0 0 24 24"><path d="M12 3.500c-5 0-9 3.200-9 7.200 0 2.500 1.600 4.700 4 6l-1 3.800 4.400-2.500c.5.100 1.100.1 1.600.1 5 0 9-3.200 9-7.400S17 3.500 12 3.500z"/></svg><span>채팅</span><em class="kt-bdg" id="ktBdg" hidden></em></button>
      <button data-tab="hash"><svg viewBox="0 0 24 24"><path d="M9 4 7.500 20M16.500 4 15 20M4 9h16M3.500 15h16"/></svg><span>#</span></button>
      <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.700"/><circle cx="12" cy="12" r="1.700"/><circle cx="19" cy="12" r="1.700"/></svg><span>더보기</span></button>
    </nav>
  </section>

  <section class="kt-view" id="ktRoom" hidden>
    <header class="kt-rbar">
      <button class="kt-ib kt-back" id="ktBack" aria-label="뒤로"><svg viewBox="0 0 12 21"><path d="M10.500 1.500 2 10.500l8.500 9"/></svg></button>
      <h1 id="ktRName"></h1>
      <button class="kt-ib" aria-label="검색"><svg viewBox="0 0 24 24"><circle cx="10.500" cy="10.500" r="6.500"/><path d="M15.500 15.500 21 21"/></svg></button>
      <button class="kt-ib" aria-label="메뉴"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    </header>
    <div class="kt-msgs" id="ktMsgs"></div>
    <form class="kt-comp" id="ktForm">
      <button type="button" class="kt-plus" aria-label="첨부"><svg viewBox="0 0 28 28"><rect x="2.500" y="2.500" width="23" height="23" rx="6"/><path d="M14 8v12M8 14h12"/></svg></button>
      <div class="kt-field">
        <textarea id="ktIn" rows="1" autocomplete="off"></textarea>
        <svg class="kt-emo" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11"/><path d="M9.500 16.500c1 2.200 2.700 3.200 4.500 3.200s3.500-1 4.500-3.200M10 11.500v1.500M18 11.500v1.500"/></svg>
        <b class="kt-hash">#</b>
      </div>
      <button type="submit" class="kt-send" id="ktSend">전송</button>
    </form>
  </section>
</div>
<script src="kakaotalk.js?v=4"></script>
</body>
</html>
